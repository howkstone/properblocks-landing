name: Site consistency

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Catches a hand-edit to pricing / FAQs / block-manager-london /
      # contractor that never went through build.js.
      - run: node scripts/consistency-check.js
      # Security sweep, 7 Nov 2026: the 404 page is in place, every new-tab
      # link is noopener noreferrer, and _headers carries the full set.
      - run: node scripts/security-check.js --self-test
      - run: node scripts/security-check.js
